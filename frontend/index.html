<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paisabuddy - Home</title>
<link rel="stylesheet" href="style.css">
<style>
/* ===== Animated Gradient Background ===== */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #e0c3fc, #fbc2eb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #333;
}

@keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* ===== Navbar ===== */
nav {
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,0.25);
    border-radius: 15px;
    padding: 12px 20px;
    margin: 15px;
    display: inline-block;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #004aad;
    font-weight: 600;
    transition: 0.3s;
}

nav a:hover {
    color: #ff9900;
    transform: scale(1.1);
}

/* ===== Hero Section ===== */
.hero {
    text-align: center;
    margin-top: 50px;
    padding: 80px 20px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    width: 90%;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    animation: fadeIn 1.5s ease;
}

.hero h1 {
    font-size: 3rem;
    font-weight: 800;
    color: #004aad;
    margin-bottom: 15px;
}

.hero p {
    font-size: 1.3rem;
    color: #222;
    margin-bottom: 30px;
}

.hero .btn {
    margin: 10px;
    background: linear-gradient(135deg, #0077ff, #00c6ff);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.hero .btn:hover {
    transform: scale(1.1);
    background: linear-gradient(135deg, #005bb5, #00a1ff);
}

/* ===== Animations ===== */
@keyframes fadeIn {
    0% {opacity: 0; transform: translateY(-30px);}
    100% {opacity: 1; transform: translateY(0);}
}

/* ===== Footer ===== */
footer {
    text-align: center;
    padding: 20px;
    color: #004aad;
    margin-top: 40px;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.15);
    border-radius: 20px 20px 0 0;
}
</style>
</head>
<body>

<!-- Navbar -->
<nav>
  <a href="index.html">Home</a> |
  <a href="features.html">Features</a> |
  <a href="Register.html">Register</a> |
  <a href="login.html">Login</a>
</nav>

<!-- Hero Section -->
<div class="hero">
  <h1>Welcome to Paisabuddy 🎉</h1>
  <p>Your smart companion for financial literacy, budgeting & fraud awareness.</p>
  <a class="btn" href="features.html">🚀 Explore Features</a>
  <a class="btn" href="Register.html">Get Started</a>
</div>

<!-- Footer -->
<footer>
  © 2025 Paisabuddy | Empowering Young India with Financial Literacy 💡
</footer>

</body>
</html>
